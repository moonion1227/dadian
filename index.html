<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打点记录（含图片上传）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", system-ui, sans-serif;
        }
        body {
            background-color: #f3f4f6;
            padding: 20px 16px;
            max-width: 720px;
            margin: 0 auto;
        }
        .container {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.07);
        }
        h1 {
            text-align: center;
            color: #1f2937;
            font-size: 22px;
            margin-bottom: 24px;
        }
        .stat-wrap {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: #eff6ff;
            border-radius: 14px;
            padding: 20px 12px;
            margin-bottom: 24px;
            text-align: center;
        }
        .stat-num {
            font-size: 32px;
            font-weight: 700;
            color: #2563eb;
        }
        .stat-desc {
            font-size: 14px;
            color: #4b5563;
            margin-top: 4px;
        }
        .task-card {
            background: #f9fafb;
            border-radius: 14px;
            padding: 24px 20px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 24px;
        }
        .task-label {
            font-size: 15px;
            color: #6b7280;
            margin-bottom: 10px;
        }
        .name-edit-wrap {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 12px;
            width: 100%;
        }
        #posNameInput {
            flex: 1;
            font-size: 20px;
            font-weight: 600;
            color: #111827;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 10px;
            background: #fff;
            min-width: 0;
        }
        .edit-btn {
            flex-shrink: 0;
            padding: 7px 10px;
            border-radius: 8px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .edit-btn:disabled {
            background: #b4caf1;
            cursor: not-allowed;
        }
        .check-times {
            font-size: 16px;
            color: #2563eb;
            line-height: 1.6;
            margin-bottom: 12px;
        }

        /* ===== 修改部分 ===== */
        .image-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            border-top: 1px dashed #d1d5db;
            padding-top: 12px;
        }
        .image-area img {
            max-height: 250px;      /* 图片变大 */
            max-width: 100%;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            width: auto;
            height: auto;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            align-items: center;
        }
        .image-btn {
            padding: 4px 16px;      /* 按钮改小 */
            border-radius: 6px;
            border: none;
            background: #e5e7eb;
            color: #1f2937;
            cursor: pointer;
            font-size: 12px;        /* 字体改小 */
            transition: 0.2s;
            min-width: 80px;
            line-height: 1.8;
        }
        .image-btn.upload {
            background: #2563eb;
            color: #fff;
        }
        .image-btn.upload:hover {
            background: #1d4ed8;
        }
        .image-btn.delete {
            background: #ef4444;
            color: #fff;
        }
        .image-btn.delete:hover {
            background: #dc2626;
        }
        .image-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .image-area .empty-tip {
            color: #9ca3af;
            font-size: 14px;
        }
        /* ===== 修改结束 ===== */

        .btn-box {
            display: flex;
            gap: 14px;
        }
        button {
            flex: 1;
            padding: 16px;
            border-radius: 12px;
            border: none;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }
        #confirmBtn {
            background-color: #2563eb;
            color: #fff;
        }
        #confirmBtn:disabled {
            background-color: #b4caf1;
            cursor: not-allowed;
        }
        #resetBtn {
            background-color: #e5e7eb;
            color: #374151;
        }
        #resetBtn:disabled {
            background-color: #d1d5db;
            color: #888;
            cursor: not-allowed;
        }
        .toast {
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 18px;
            z-index: 9999;
            display: none;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>打点记录26.7.27</h1>
    <div class="stat-wrap">
        <div>
            <div class="stat-num" id="finishCount">0</div>
            <div class="stat-desc">已检查次数</div>
        </div>
        <div>
            <div class="stat-num" id="totalCheckNum">0</div>
            <div class="stat-desc">总次数</div>
        </div>
    </div>

    <div class="task-card">
        <div class="task-label">当前点位（可编辑）</div>
        <div class="name-edit-wrap">
            <input type="text" id="posNameInput">
            <button class="edit-btn" id="saveNameBtn">保存</button>
        </div>
        <div class="check-times" id="timesText"></div>

        <!-- 图片上传和预览区域 -->
        <div class="image-area" id="imageArea">
            <!-- 动态渲染 -->
        </div>
    </div>

    <div class="btn-box">
        <button id="confirmBtn">本次确认检查</button>
        <button id="resetBtn">重置全部进度</button>
    </div>
</div>
<div class="toast" id="toast">点位已打</div>

<script>
    (function() {
        // ---------- 原始点位数据 ----------
        const rawList = [
            {name:"4楼",times:1},
            {name:"1楼消防栓",times:2},
            {name:"1-15",times:1},
            {name:"1-12",times:1},
            {name:"2号门",times:3},
            {name:"喵喵理发消防栓",times:1},
            {name:"3-12",times:1},
            {name:"3-13",times:1},
            {name:"3-14",times:1},
            {name:"3-10",times:1},
            {name:"下一个口子",times:1},
            {name:"万达影城",times:1},
            {name:"3-8",times:1},
            {name:"3楼2号厕所",times:1},
            {name:"3-7内",times:1},
            {name:"舞萌dx",times:1},
            {name:"3-6",times:1},
            {name:"3-5内",times:1},
            {name:"3-4",times:1},
            {name:"3-3",times:1},
            {name:"3楼电梯",times:1},
            {name:"对面",times:1},
            {name:"2-2",times:1},
            {name:"3福",times:1},
            {name:"2-3",times:1},
            {name:"2-4",times:1},
            {name:"2楼3号厕所外",times:2},
            {name:"2-6",times:1},
            {name:"2-7",times:2},
            {name:"2-8",times:1},
            {name:"2-9",times:1},
            {name:"2-10",times:1},
            {name:"2楼1号厕所",times:1},
            {name:"3号货梯",times:1},
            {name:"1-10",times:1},
            {name:"1-9",times:1},
            {name:"1-8",times:1},
            {name:"1-7",times:1},
            {name:"1-6",times:1},
            {name:"1-4",times:1},
            {name:"1-3",times:1},
            {name:"麦当劳甜品站",times:1},
            {name:"1-2",times:2},
            {name:"1-1",times:1},
            {name:"1号门",times:1},
            {name:"3号门",times:1},
            {name:"kkv",times:1},
            {name:"全聚德电梯",times:1},
            {name:"沿江168-7",times:1},
            {name:"前面一个门",times:1},
            {name:"1-10",times:1}
        ];

        const totalCheckSum = rawList.reduce((sum, item) => sum + item.times, 0);
        const STORAGE_KEY = "fire_check_v7_data";
        const DB_NAME = "PointImageDB";
        const STORE_NAME = "images";

        // ---------- IndexedDB 图片操作 ----------
        function openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onupgradeneeded = function(e) {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: "idx" });
                    }
                };
                request.onsuccess = function(e) {
                    resolve(e.target.result);
                };
                request.onerror = function(e) {
                    reject(e.target.error);
                };
            });
        }

        async function saveImage(idx, dataUrl) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                const req = store.put({ idx: idx, data: dataUrl });
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        async function getImage(idx) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readonly");
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(idx);
                req.onsuccess = () => resolve(req.result ? req.result.data : null);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteImage(idx) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, "readwrite");
                const store = tx.objectStore(STORE_NAME);
                const req = store.delete(idx);
                req.onsuccess = () => resolve();
                req.onerror = () => reject(req.error);
            });
        }

        // ---------- 应用状态 ----------
        let taskList = JSON.parse(JSON.stringify(rawList));
        let currentIdx = 0;
        let currentConfirm = 0;
        let finishTotal = 0;
        let isLocked = false;

        const finishCountEl = document.getElementById("finishCount");
        const totalCheckNumEl = document.getElementById("totalCheckNum");
        const posNameInput = document.getElementById("posNameInput");
        const saveNameBtn = document.getElementById("saveNameBtn");
        const timesTextEl = document.getElementById("timesText");
        const confirmBtn = document.getElementById("confirmBtn");
        const resetBtn = document.getElementById("resetBtn");
        const toast = document.getElementById("toast");
        const imageArea = document.getElementById("imageArea");

        let fileInput = null;

        function init() {
            const cache = localStorage.getItem(STORAGE_KEY);
            if (cache) {
                const data = JSON.parse(cache);
                currentIdx = data.curIdx ?? 0;
                currentConfirm = data.curConfirm ?? 0;
                finishTotal = data.finishTotal ?? 0;
                if (data.modifiedList) taskList = data.modifiedList;
            }
            if (currentIdx >= taskList.length) currentIdx = taskList.length;
            render();
        }

        function saveLocal() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
                curIdx: currentIdx,
                curConfirm: currentConfirm,
                finishTotal: finishTotal,
                modifiedList: taskList
            }));
        }

        async function render() {
            totalCheckNumEl.textContent = totalCheckSum;
            finishCountEl.textContent = finishTotal;

            imageArea.innerHTML = '';

            if (currentIdx >= taskList.length) {
                posNameInput.value = "全部点位检查完毕";
                posNameInput.disabled = true;
                saveNameBtn.disabled = true;
                timesTextEl.textContent = "";
                confirmBtn.disabled = true;
                resetBtn.disabled = isLocked;
                imageArea.innerHTML = `<span class="empty-tip">已完成所有点位</span>`;
                return;
            }

            const item = taskList[currentIdx];
            posNameInput.disabled = false;
            saveNameBtn.disabled = false;
            posNameInput.value = item.name;
            timesTextEl.innerHTML = `该点位需检查：${item.times} 次｜已确认：${currentConfirm}/${item.times}`;
            confirmBtn.disabled = isLocked;
            resetBtn.disabled = isLocked;

            try {
                const imageData = await getImage(currentIdx);
                // 图片
                if (imageData) {
                    const img = document.createElement('img');
                    img.src = imageData;
                    img.alt = '点位图片';
                    imageArea.appendChild(img);
                } else {
                    const tip = document.createElement('span');
                    tip.className = 'empty-tip';
                    tip.textContent = '暂无图片';
                    imageArea.appendChild(tip);
                }

                // 按钮容器（垂直排列）
                const btnGroup = document.createElement('div');
                btnGroup.className = 'btn-group';

                // 上传按钮
                const uploadBtn = document.createElement('button');
                uploadBtn.className = 'image-btn upload';
                uploadBtn.textContent = '📤 上传图片';
                uploadBtn.disabled = isLocked;
                uploadBtn.addEventListener('click', function() {
                    if (isLocked) return;
                    if (!fileInput) {
                        fileInput = document.createElement('input');
                        fileInput.type = 'file';
                        fileInput.accept = 'image/*';
                        fileInput.style.display = 'none';
                        document.body.appendChild(fileInput);
                        fileInput.addEventListener('change', async function(e) {
                            const file = e.target.files[0];
                            if (!file) return;
                            const reader = new FileReader();
                            reader.onload = async function(ev) {
                                const dataUrl = ev.target.result;
                                await saveImage(currentIdx, dataUrl);
                                render();
                            };
                            reader.readAsDataURL(file);
                            fileInput.value = '';
                        });
                    }
                    fileInput.click();
                });
                btnGroup.appendChild(uploadBtn);

                // 删除按钮（仅当有图片时显示）
                if (imageData) {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'image-btn delete';
                    delBtn.textContent = '🗑️ 删除图片';
                    delBtn.disabled = isLocked;
                    delBtn.addEventListener('click', async function() {
                        if (isLocked) return;
                        if (!confirm('确定删除该点位的图片吗？')) return;
                        await deleteImage(currentIdx);
                        render();
                    });
                    btnGroup.appendChild(delBtn);
                }

                imageArea.appendChild(btnGroup);

            } catch (e) {
                console.error('图片加载失败', e);
                imageArea.innerHTML = `<span class="empty-tip">图片加载失败</span>`;
            }
        }

        function showToastAndLock() {
            isLocked = true;
            toast.style.display = "block";
            render();
            setTimeout(() => {
                isLocked = false;
                toast.style.display = "none";
                render();
            }, 1500);
        }

        // ---------- 事件绑定 ----------
        saveNameBtn.addEventListener("click", () => {
            const newName = posNameInput.value.trim();
            if (!newName) return;
            if (currentIdx < taskList.length) {
                taskList[currentIdx].name = newName;
                saveLocal();
                render();
            }
        });

        confirmBtn.addEventListener("click", () => {
            if (isLocked) return;
            if (currentIdx >= taskList.length) return;
            const item = taskList[currentIdx];
            currentConfirm++;
            finishTotal++;

            if (currentConfirm >= item.times) {
                currentIdx++;
                currentConfirm = 0;
            }
            saveLocal();
            render();
            showToastAndLock();
        });

        resetBtn.addEventListener("click", () => {
            if (isLocked) return;
            if (!confirm('确定重置全部进度吗？')) return;
            currentIdx = 0;
            currentConfirm = 0;
            finishTotal = 0;
            saveLocal();
            render();
        });

        init();
    })();
</script>
</body>
</html>
